{% extends "_base.html" %}
{% block content %}
  <h1>UK Train Journey Planner</h1>
  <p class="sub">Direct trains only, for now — enter two CRS station codes, a date, and a time to see everything departing in the next hour.</p>
  <div class="card">
    <form action="/results" method="get">
      <div class="row">
        <div class="field">
          <label for="from_">From (CRS code)</label>
          <input id="from_" name="from_" placeholder="BNS" maxlength="3" required autocomplete="off">
        </div>
        <div class="field">
          <label for="to">To (CRS code)</label>
          <input id="to" name="to" placeholder="WAT" maxlength="3" required autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="time">Time</label>
          <input id="time" name="time" type="time" required>
        </div>
      </div>
      <button type="submit">Find trains</button>
    </form>
  </div>
{% endblock %}
