services:
  app:
    build: .
    ports:
      - "8010:8000"
    volumes:
      - gtfs-data:/app/data
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  gtfs-data:
