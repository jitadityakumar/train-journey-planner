services:
  otp:
    # Pinned by digest (2.9.0, a genuine numbered release off `master`, not
    # a `dev-2.x` SNAPSHOT) — must match the digest poll_and_build.sh builds
    # the graph with (see its own comment) and deploy-otp-sidecar.sh pulls,
    # or the serving container refuses to load the graph ("graph file is
    # incompatible with this version of OTP"). Found 2026-08-30: this
    # service had drifted to unpinned `latest`, which resolves to whatever
    # dev-2.x snapshot Docker Hub last pushed — the graph poll_and_build.sh
    # built (also then-unpinned) landed on a newer serialization version
    # than this container, and it crash-looped for a week undetected.
    # Bump all three places together, deliberately, then force a rebuild —
    # never let any of them float independently or track `latest` again.
    image: opentripplanner/opentripplanner@sha256:a7eac7da397faa9ec9dee407d4204895d24df4981500662fa6793aae0e71fd8f
    command: ["--load", "--port", "8080"]
    volumes:
      - ./graphs:/var/opentripplanner
    # Bind 0.0.0.0, not this box's Tailscale IP. Switched 2026-08-22: binding
    # to the Tailscale IP directly raced Tailscale's own startup on boot —
    # Docker can come up (and attempt `restart: unless-stopped`) before
    # tailscaled has reassigned the IP to tailscale0, so the bind fails and
    # the container is left Exited with no automatic recovery (root-caused
    # after a jk-server-ccu reboot left the sidecar down for 2 days). Safe to
    # widen because jk-server-ccu's UFW defaults to deny (incoming) with only
    # an explicit `Anywhere on tailscale0` allow rule — LAN/public-IPv6
    # traffic to 8080 is blocked regardless of what the container binds to,
    # so this doesn't change what's actually reachable, only removes the
    # boot-order race. See otp-sidecar/README.md.
    ports:
      - "8080:8080"
    healthcheck:
      # No wget/curl in this image (Ubuntu-based, minimal) — bash is present,
      # so use /dev/tcp to at least confirm the HTTP server is accepting
      # connections. The main app's own health-check job (app/otp_client.py)
      # does the real actuator-endpoint check over Tailscale.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
